opencollection: 1.0.0

info:
  name: ZCanopy API Gateway - 2
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ""
      port: ""
      auth:
        username: ""
        password: ""
      bypassProxy: ""

request:
  variables:
    - name: baseUrl
      value: http://localhost:3000/api
    - name: accessToken
      value: ""
    - name: sessionToken
      value: ""
    - name: customerSessionToken
      value: d13cc037-3cea-46a9-bee5-fb8b683148de
    - name: webSessionId
      value: d13cc037-3cea-46a9-bee5-fb8b683148de
    - name: deviceId
      value: device-001

docs:
  content: Postman collection for ZCanopy microservices API Gateway running on port 4000
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
