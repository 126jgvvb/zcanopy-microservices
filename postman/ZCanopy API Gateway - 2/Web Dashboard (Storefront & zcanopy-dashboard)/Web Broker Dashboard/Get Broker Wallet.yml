info:
  name: Get Broker Wallet
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/web/broker/wallet"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
