info:
  name: Get Customer Favorites
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/web/customer/favorites"
  headers:
    - name: Authorization
      value: Bearer {{customerSessionToken}}
    - name: x-session-id
      value: "{{webSessionId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
