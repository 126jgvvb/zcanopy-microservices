info:
  name: Verify Broker OTP
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/broker/otp/verify"
  body:
    type: json
    data: |-
      {
        "email": "alice@example.com",
        "phoneNumber": "+256701234567",
        "emailCode": "123456",
        "phoneCode": "654321"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
