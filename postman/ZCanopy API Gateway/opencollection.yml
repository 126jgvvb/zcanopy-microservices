opencollection: 1.0.0

info:
  name: ZCanopy API Gateway

request:
  variables:
    - name: baseUrl
      value: http://localhost:3000/api
    - name: accessToken
      value: ""
    - name: sessionToken
      value: ""
    - name: customerSessionToken
      value: ""

docs:
  content: Postman collection for ZCanopy microservices API Gateway running on port 4000
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
