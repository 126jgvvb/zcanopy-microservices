info:
  name: Create Customer Booking
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/customer/bookings"
  body:
    type: json
    data: |-
      {
        "sessionToken": "{{customerSessionToken}}",
        "propertyId": "prop-123",
        "customerName": "John Doe",
        "customerPhone": "0700000000",
        "customerEmail": "john@example.com",
        "date": "2024-12-01",
        "amount": 10000,
        "reason": "Property viewing",
        "status": "confirmed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
