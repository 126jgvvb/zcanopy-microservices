info:
  name: Submit Help Request
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseUrl}}/web/broker/help"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "subject": "Cannot see bookings",
        "message": "Please assist."
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
