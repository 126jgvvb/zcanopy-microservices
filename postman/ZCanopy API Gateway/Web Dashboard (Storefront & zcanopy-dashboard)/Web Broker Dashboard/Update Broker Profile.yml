info:
  name: Update Broker Profile
  type: http
  seq: 19

http:
  method: POST
  url: "{{baseUrl}}/web/broker/profile"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "Demo Broker",
        "phoneNumber": "+256700000000",
        "location": "Kampala"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
