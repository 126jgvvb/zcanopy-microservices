info:
  name: Subscribe (Web Broker)
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/web/broker/subscribe"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "tier": "premium",
        "phoneNumber": "+256701234567"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
