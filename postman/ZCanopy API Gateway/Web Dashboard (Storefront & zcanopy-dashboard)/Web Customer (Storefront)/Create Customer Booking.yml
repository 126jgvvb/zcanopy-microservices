info:
  name: Create Customer Booking
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/web/customer/bookings"
  headers:
    - name: Authorization
      value: Bearer {{customerSessionToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "propertyId": "2",
        "customerName": "John Doe",
        "customerPhone": "0741882818",
        "customerEmail": "john@example.com",
        "date": "2026-12-01",
        "amount": 100
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
