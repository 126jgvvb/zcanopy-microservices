info:
  name: List Customer Properties
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/web/customer/properties"
  headers:
    - name: Authorization
      value: Bearer {{customerSessionToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
