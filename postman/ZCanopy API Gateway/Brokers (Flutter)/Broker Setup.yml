info:
  name: Broker Setup
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth/broker/setup"
  body:
    type: json
    data: |-
      {
        "brokerCode": "BROKER123",
        "password": "password123",
        "deviceId": "device-001",
        "brokerBrandName": "My Broker Brand"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
