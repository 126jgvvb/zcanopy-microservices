info:
  name: Broker Logout
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/brokers/logout-user"
  body:
    type: json
    data: |-
      {
        "brokerCode": "BROKER123",
        "sessionId": "{{sessionToken}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
