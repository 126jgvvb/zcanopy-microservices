info:
  name: Update Admin SMS
  type: http
  seq: 22

http:
  method: PUT
  url: "{{baseUrl}}/admin/sms"
  body:
    type: json
    data: |-
      {
        "smsProvider": "twilio",
        "apiKey": "your-api-key"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
