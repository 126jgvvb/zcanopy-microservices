info:
  name: Get All Customer Searches
  type: http
  seq: 30

http:
  method: GET
  url: "{{baseUrl}}/admin/searches"
  headers:
    - key: Authorization
      value: Bearer {{adminToken}}
  params:
    - key: page
      value: "1"
    - key: limit
      value: "20"
    - key: sessionToken
      value: ""
    - key: q
      value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
