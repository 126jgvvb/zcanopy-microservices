info:
  name: Delete Admin
  type: http
  seq: 3

http:
  method: DELETE
  url: "{{baseUrl}}/admin/admins/{{adminId}}"
  body:
    type: json
    data: |-
      {
        "deletedBy": "{{adminId}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
