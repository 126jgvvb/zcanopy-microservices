info:
  name: Broker Login
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/auth/broker/login"
  body:
    type: json
    data: |-
      {
        "brokerCode": "BROKER123",
        "password": "password123",
        "deviceId": "device-001"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
