opencollection: 1.0.0

info:
  name: ZCanopy API Gateway - 5

request:
  variables:
    - name: baseUrl
      value: http://localhost:4000/api
    - name: accessToken
      value: ""
    - name: customerAccessToken
      value: ""
    - name: sessionToken
      value: ""
    - name: webSessionId
      value: ""
    - name: deviceId
      value: device-001
    - name: customerId
      value: c1

docs:
  content: Postman collection for ZCanopy microservices API Gateway running on port 4000
  type: text/markdown
bundled: false
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
