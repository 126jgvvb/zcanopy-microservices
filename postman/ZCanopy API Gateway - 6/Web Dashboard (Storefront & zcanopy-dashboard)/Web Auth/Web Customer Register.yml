info:
  name: Web Customer Register
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/web/customer/register"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "email": "newcustomer@example.com",
        "password": "password123",
        "firstName": "John",
        "lastName": "Doe",
        "phoneNumber": "+256700000000"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
