info:
  name: Retrieve Customer Searches
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/customer/searches/retrieve"
  body:
    type: json
    data: |-
      {
        "sessionToken": "{{customerSessionToken}}",
        "page": 1,
        "limit": 10
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
