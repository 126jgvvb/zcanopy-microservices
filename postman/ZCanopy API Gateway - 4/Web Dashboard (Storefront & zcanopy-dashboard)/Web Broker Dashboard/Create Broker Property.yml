info:
  name: Create Broker Property
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/web/broker/properties"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "title": "3 Bedroom House",
        "description": "Spacious home",
        "price": 250000,
        "location": "Kampala"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
