info:
  name: Get Featured Properties (Web)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/web/public/properties/featured"
  headers:
    - name: x-session-id
      value: "{{webSessionId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
