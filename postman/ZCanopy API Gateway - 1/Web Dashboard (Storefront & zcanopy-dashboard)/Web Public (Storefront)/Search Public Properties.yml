info:
  name: Search Public Properties
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/web/public/search?q=New house in mukono"
  headers:
    - name: x-session-id
      value: "{{webSessionId}}"
  params:
    - name: q
      value: New house in mukono
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
