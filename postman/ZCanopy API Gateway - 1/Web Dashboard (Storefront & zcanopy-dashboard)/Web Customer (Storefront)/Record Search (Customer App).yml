info:
  name: Record Search (Customer App)
  type: http
  seq: 12

http:
  method: POST
  url: "{{baseUrl}}/web/customer/search/record"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-session-id
      value: "{{webSessionId}}"
  body:
    type: json
    data: |-
      {
        "sessionToken": "{{customerSessionToken}}",
        "query": "",
        "location": "",
        "radius": 0,
        "propertyType": "",
        "filters": {},
        "resultPropertyIds": [],
        "resultCount": 0,
        "minPrice": 0,
        "maxPrice": 0,
        "subCounty": "",
        "district": ""
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
