info:
  name: Validate Session (x-session-id)
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/web/session/validate"
  headers:
    - name: Content-Type
      value: application/json
    - name: x-session-id
      value: "{{webSessionId}}"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
