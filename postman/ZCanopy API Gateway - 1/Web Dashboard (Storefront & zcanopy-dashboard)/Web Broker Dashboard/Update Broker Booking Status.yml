info:
  name: Update Broker Booking Status
  type: http
  seq: 8

http:
  method: PUT
  url: "{{baseUrl}}/web/broker/bookings/booking-123/status"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "status": "confirmed"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
