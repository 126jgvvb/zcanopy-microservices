info:
  name: Get Broker Notifications
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/web/broker/notifications"
  headers:
    - name: Authorization
      value: Bearer {{accessToken}}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
