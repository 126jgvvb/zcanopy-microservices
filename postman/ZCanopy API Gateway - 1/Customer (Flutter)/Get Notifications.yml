info:
  name: Get Notifications
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/notifications/get_notifications"
  body:
    type: json
    data: |-
      {
        "sessionToken": "{{customerSessionToken}}",
        "page": 1,
        "limit": 10,
        "status": "unread",
        "type": "booking",
        "channel": "push",
        "read": false
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
