info:
  name: Subscribe Broker to Tier
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/brokers/1/subscribe"
  body:
    type: json
    data: |-
      {
        "tier": "premium",
        "phoneNumber": "0700000000"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
