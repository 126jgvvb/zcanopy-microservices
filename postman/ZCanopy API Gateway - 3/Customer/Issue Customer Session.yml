info:
  name: Issue Customer Session
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/customer/session"
  body:
    type: json
    data: |-
      {
        "deviceId": "device-001",
        "ttlSeconds": 86400
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
